name: learn_dbt

profile: learn_dbt

seed-paths: ["seeds"]
model-paths: ["models", "model_sub"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  learn_dbt:
    +schema: raw

models:
  learn_dbt:
    model_dir_test:
      +materialized: view

    model_sub:
      +materialized: view

    materialization:
      +materialized: table

    incremental:
      +materialized: incremental

    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
